{% extends 'torneos/base.html' %}

{% block titulo %}Crear Torneo{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Nuevo Torneo</h4>
        </div>
        <div class="card-body">
            {% url 'lista_torneos' as cancelar %}
            {% include 'torneos/_form_torneo.html' with boton='Guardar' cancelar=cancelar %}
        </div>
    </div>
  </div>
</div>
{% endblock %}
