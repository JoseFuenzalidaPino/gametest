{% extends 'torneos/base.html' %}

{% block titulo %}Editar Torneo{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <div class="card shadow">
        <div class="card-header bg-warning text-dark">
            <h4 class="mb-0">Editar Torneo: {{ torneo.nombre }}</h4>
        </div>
        <div class="card-body">
            {% url 'detalle_torneo' torneo.id as cancelar %}
            {% include 'torneos/_form_torneo.html' with boton='Actualizar' cancelar=cancelar %}
        </div>
    </div>
  </div>
</div>
{% endblock %}
