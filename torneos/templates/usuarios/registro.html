{% extends 'torneos/base.html' %}
{% block titulo %}Registro{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow">
      <div class="card-header bg-dark text-white">
        <h4 class="mb-0">Registrarse como Jugador</h4>
      </div>
      <div class="card-body">
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="{% url 'registro' %}">
          {% csrf_token %}
          <input type="text" name="username" placeholder="Usuario" class="form-control mb-2" required>
          <input type="password" name="password" placeholder="Contraseña" class="form-control mb-3" required>
          <button type="submit" class="btn btn-success w-100">Registrarse</button>
        </form>
        <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
